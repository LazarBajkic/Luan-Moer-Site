			</div>
			
			<div class="additional-info-wrapper">
				
				<span style="margin-bottom:30px">Materijal: 100% premium pamuk</span>
			
				<div class="size-price">
					
					<span style="font-size:30px;">4.999 RSD</span>
					
					<select>
					<option value="XS">XS</option>
					<option value="S">S</option>
					<option value="M">M</option>
					<option value="L">L</option>
					<option value="XL">XL</option>
					<option value="XXL">XXL</option>
					</select>
					
					<button id="sizeChartBtn" class="sizeChartBtn">Vodič veličina</button>
					
				</div>
			
			</div>
			
			
		</div>
		
		<div class="info-buttons">
			
			<button type="submit" class="util-button">Dodaj u korpu</button>
			
			
			
			<a class="icon-container heart-container" th:href="@{/FavoritesPage}"></a>
